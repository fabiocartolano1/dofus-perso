<!doctype html>
<html lang="fr" data-suivi="dofus-ocre">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Suivi Dofus Ocre</title>
<style>
:root {
  --ecorce: #241a12;
  --bois: #33261a;
  --bois-clair: #46351f;
  --ocre: #e3a62b;
  --ocre-sombre: #8a5f12;
  --parchemin: #f2e6cc;
  --parchemin-doux: #bcaa8a;
  --rouge: #b9423a;
  --rouge-survol: #cf5349;
  --vert: #3f9d5c;
  --vert-survol: #4db26c;
  --serif: "Iowan Old Style", "Palatino Linotype", Palatino, "Book Antiqua", Georgia, serif;
}
* { box-sizing: border-box; }
html { scroll-padding-top: 130px; }
body {
  margin: 0;
  background: var(--ecorce);
  color: var(--parchemin);
  font: 16px/1.4 var(--serif);
  font-variant-numeric: tabular-nums;
}
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible { outline: 3px solid var(--parchemin); outline-offset: 1px; }

.tete {
  position: sticky;
  top: 0;
  z-index: 5;
  background: var(--bois);
  border-bottom: 3px solid var(--ocre-sombre);
}
.tete-int {
  max-width: 1120px;
  margin: 0 auto;
  padding: 10px 16px;
  display: grid;
  grid-template-columns: auto minmax(190px, 1fr) minmax(150px, 1fr) minmax(150px, 1fr);
  gap: 8px 24px;
  align-items: center;
}
.oeuf { width: 62px; height: 78px; display: block; grid-row: span 2; }
.oeuf rect { transition: y .2s ease-out, height .2s ease-out; }
h1 { margin: 0; font-size: 21px; line-height: 1.15; font-weight: 600; }
.mesure .titre { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.mesure .valeur { font-size: 22px; font-weight: 600; color: var(--ocre); }
.mesure.grand .valeur { font-size: 30px; }
.barre { height: 7px; background: var(--ecorce); margin-top: 3px; overflow: hidden; }
.barre i { display: block; height: 100%; width: 0; background: var(--ocre); }
.sauvegarde {
  grid-column: 2 / -1;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  font-size: 14px;
  color: var(--parchemin-doux);
  min-height: 32px;
}
.sauvegarde.alerte { color: var(--parchemin); }
.sauvegarde button {
  flex: none;
  padding: 5px 12px;
  background: var(--ocre);
  color: var(--ecorce);
  border: 0;
  font-weight: 600;
}
.sauvegarde button:hover { background: #f0b940; }
[hidden] { display: none !important; }

main { max-width: 1120px; margin: 0 auto; padding: 8px 16px 64px; }
.etape { margin-top: 30px; }
.etape-tete { display: flex; align-items: baseline; gap: 14px; padding-bottom: 5px; }
h2 { margin: 0; flex: 1; font-size: 22px; line-height: 1.2; font-weight: 600; }
.compte { font-size: 14px; color: var(--parchemin-doux); }
.pct { font-size: 24px; font-weight: 600; color: var(--ocre); min-width: 64px; text-align: right; }
.etape.complete h2 { color: var(--ocre); }

.ligne {
  display: grid;
  grid-template-columns: minmax(0, 1fr) repeat(6, 76px) 118px;
  gap: 2px;
  align-items: stretch;
  margin-top: 2px;
}
.colonnes { font-size: 13px; color: var(--parchemin-doux); text-align: center; margin-top: 7px; }
.colonnes span:first-child { text-align: left; padding-left: 10px; }
.nom {
  background: var(--bois);
  padding: 5px 10px;
  min-width: 0;
  overflow-wrap: anywhere;
  line-height: 1.2;
}
.nom small { display: block; font-size: 13px; color: var(--parchemin-doux); }
.case {
  min-height: 34px;
  padding: 0;
  border: 0;
  background: var(--rouge);
  color: #fff;
  font-size: 18px;
  line-height: 1;
}
.case:hover { background: var(--rouge-survol); }
.case[aria-pressed="true"] { background: var(--vert); }
.case[aria-pressed="true"]:hover { background: var(--vert-survol); }
.case[aria-pressed="true"]::after { content: "\2713"; }
.tout {
  padding: 0 4px;
  border: 0;
  background: var(--bois-clair);
  font-size: 14px;
}
.tout:hover { background: #5b4629; }

@media (max-width: 860px) {
  html { scroll-padding-top: 170px; }
  .tete-int { grid-template-columns: auto 1fr 1fr; gap: 6px 14px; }
  .oeuf { width: 44px; height: 56px; grid-row: auto; }
  h1, .mesure.grand { grid-column: 2 / -1; }
  .mesure-boss { grid-column: 1 / 3; }
  .sauvegarde { grid-column: 1 / -1; }
  .mesure.grand .valeur { font-size: 24px; }
  .ligne { grid-template-columns: repeat(6, minmax(0, 1fr)); }
  .nom, .colonnes span:first-child { grid-column: 1 / -1; }
  .colonnes span:first-child, .colonnes span:last-child { display: none; }
  .tout { grid-column: 1 / -1; min-height: 34px; }
  .ligne:not(.colonnes) { margin-top: 10px; }
}
@media (prefers-reduced-motion: reduce) {
  .oeuf rect { transition: none; }
}
</style>
</head>

</header>

<script>
(function () {
  'use strict';

  var noeud = document.getElementById('donnees');
  var donnees = JSON.parse(noeud.textContent);
  var app = document.getElementById('app');
  var MOTIF = /(<script id="donnees" type="application\/json">)[\s\S]*?(<\/script>)/;
  var NBSP = ' ';

  var compteurs = donnees.etapes.map(function (e) {
    var fait = 0;
    e.monstres.forEach(function (m) {
      m.cases.forEach(function (v) { if (v) fait++; });
    });
    return { fait: fait, total: e.monstres.length * donnees.personnages.length };
  });

  function echapper(t) {
    return String(t).replace(/[&<>"]/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c];
    });
  }

  function rendu() {
    var colonnes = '<div class="ligne colonnes" aria-hidden="true"><span>Monstre</span>' +
      donnees.personnages.map(function (p) { return '<span>' + echapper(p) + '</span>'; }).join('') +
      '<span></span></div>';

    app.innerHTML = donnees.etapes.map(function (etape, e) {
      var lignes = etape.monstres.map(function (m, l) {
        var cases = m.cases.map(function (v, c) {
          return '<button type="button" class="case" data-e="' + e + '" data-l="' + l + '" data-c="' + c +
            '" aria-pressed="' + (v ? 'true' : 'false') + '" aria-label="' +
            echapper(m.nom + ', ' + donnees.personnages[c]) + '"></button>';
        }).join('');
        return '<div class="ligne"><div class="nom">' + echapper(m.nom) +
          (m.alias ? '<small>' + echapper(m.alias) + '</small>' : '') + '</div>' + cases +
          '<button type="button" class="tout" data-e="' + e + '" data-l="' + l + '"></button></div>';
      }).join('');
      return '<section class="etape" id="etape-' + e + '"><div class="etape-tete"><h2>' + echapper(etape.nom) +
        '</h2><span class="compte"></span><span class="pct"></span></div>' +
        '<div class="barre"><i></i></div>' + colonnes + lignes + '</section>';
    }).join('');
  }

  rendu();

  var sections = donnees.etapes.map(function (_, e) {
    var s = document.getElementById('etape-' + e);
    return {
      racine: s,
      compte: s.querySelector('.compte'),
      pct: s.querySelector('.pct'),
      barre: s.querySelector('.barre i'),
      lignes: Array.prototype.map.call(s.querySelectorAll('.ligne:not(.colonnes)'), function (r) {
        return { cases: r.querySelectorAll('.case'), tout: r.querySelector('.tout') };
      })
    };
  });

  // Arrondi vers le bas : 100 % ne s'affiche que si tout est coché.
  function ratio(f, t) { return t ? f / t : 0; }
  function pctEntier(r) { return Math.floor(r * 100 + 1e-9) + NBSP + '%'; }
  function pctDecimal(r) {
    return (Math.floor(r * 1000 + 1e-9) / 10).toLocaleString('fr-FR', {
      minimumFractionDigits: 1, maximumFractionDigits: 1
    }) + NBSP + '%';
  }
  function majMesure(cle, r) {
    document.getElementById(cle + '-pct').textContent = pctDecimal(r);
    document.getElementById(cle + '-barre').style.width = (r * 100) + '%';
  }

  function majHaut() {
    var g = { fait: 0, total: 0 }, b = { fait: 0, total: 0 }, a = { fait: 0, total: 0 };
    compteurs.forEach(function (c, e) {
      var cible = donnees.etapes[e].groupe === 'boss' ? b : a;
      g.fait += c.fait; g.total += c.total;
      cible.fait += c.fait; cible.total += c.total;
    });
    var r = ratio(g.fait, g.total);
    majMesure('global', r);
    majMesure('boss', ratio(b.fait, b.total));
    majMesure('archi', ratio(a.fait, a.total));
    var fond = document.getElementById('remplissage');
    fond.setAttribute('height', 72 * r);
    fond.setAttribute('y', 74 - 72 * r);
  }

  function majEtape(e) {
    var c = compteurs[e], s = sections[e], r = ratio(c.fait, c.total);
    s.compte.textContent = c.fait + ' / ' + c.total;
    s.pct.textContent = pctEntier(r);
    s.barre.style.width = (r * 100) + '%';
    s.racine.classList.toggle('complete', c.fait === c.total);
  }

  function ligneComplete(e, l) {
    return donnees.etapes[e].monstres[l].cases.every(function (v) { return v; });
  }

  function majTout(e, l) {
    sections[e].lignes[l].tout.textContent = ligneComplete(e, l) ? 'Tout décocher' : 'Tout cocher';
  }

  function poser(e, l, c, valeur) {
    var cases = donnees.etapes[e].monstres[l].cases;
    if (!!cases[c] === valeur) return;
    cases[c] = valeur ? 1 : 0;
    compteurs[e].fait += valeur ? 1 : -1;
    sections[e].lignes[l].cases[c].setAttribute('aria-pressed', valeur ? 'true' : 'false');
  }

  app.addEventListener('click', function (ev) {
    var b = ev.target.closest('button');
    if (!b) return;
    var e = Number(b.dataset.e), l = Number(b.dataset.l);
    if (b.classList.contains('case')) {
      var c = Number(b.dataset.c);
      poser(e, l, c, !donnees.etapes[e].monstres[l].cases[c]);
    } else {
      var valeur = !ligneComplete(e, l);
      donnees.personnages.forEach(function (_, i) { poser(e, l, i, valeur); });
    }
    majTout(e, l);
    majEtape(e);
    majHaut();
    aChange();
  });

  sections.forEach(function (s, e) {
    s.lignes.forEach(function (_, l) { majTout(e, l); });
    majEtape(e);
  });
  majHaut();

  /* ---------- Sauvegarde dans le fichier ---------- */

  var zone = document.getElementById('sauvegarde');
  var statut = document.getElementById('statut');
  var action = document.getElementById('action');
  var fichier = null;
  var autorise = false;
  var version = 0;
  var versionEcrite = 0;
  var ecriture = false;
  var relancer = false;
  var minuteur = null;
  var pickerDispo = typeof window.showOpenFilePicker === 'function';
  var actionCourante = null;

  function nomFichier() {
    var nom = decodeURIComponent(location.pathname.split('/').pop() || '');
    return nom || 'Suivi_Dofus_Ocre.html';
  }

  function json(v) { return JSON.stringify(v).replace(/</g, '\\u003c'); }

  function serialiser() {
    var etapes = donnees.etapes.map(function (e) {
      return '{"nom":' + json(e.nom) + ',"groupe":' + json(e.groupe) + ',"monstres":[\n' +
        e.monstres.map(json).join(',\n') + '\n]}';
    });
    return '{"titre":' + json(donnees.titre) + ',\n"personnages":' + json(donnees.personnages) +
      ',\n"etapes":[\n' + etapes.join(',\n') + '\n]}';
  }

  function remplacer(source) {
    if (!MOTIF.test(source)) throw new Error('données introuvables');
    return source.replace(MOTIF, function (_, debut, fin) {
      return debut + '\n' + serialiser() + '\n' + fin;
    });
  }

  function afficher(texte, alerte, libelle, fn) {
    statut.textContent = texte;
    zone.classList.toggle('alerte', !!alerte);
    actionCourante = fn || null;
    action.hidden = !fn;
    action.textContent = libelle || '';
  }

  action.addEventListener('click', function () { if (actionCourante) actionCourante(); });

  function etatNonLie() {
    var attente = version !== versionEcrite;
    if (pickerDispo) {
      afficher(attente ? 'Tes changements ne sont pas encore dans le fichier.' :
        'Lie ce fichier pour enregistrer chaque clic automatiquement.',
        attente, 'Enregistrer dans ce fichier', lier);
    } else {
      afficher(attente ? 'Tes changements ne sont pas encore dans le fichier.' :
        'Ce navigateur ne peut pas modifier le fichier directement.',
        attente, 'Télécharger le fichier à jour', telecharger);
    }
  }

  function aChange() {
    version++;
    if (enLigne) { planifierEnvoi(); return; }
    if (!fichier) { etatNonLie(); return; }
    if (!autorise) { reprendre(); return; }
    clearTimeout(minuteur);
    minuteur = setTimeout(enregistrer, 150);
  }

  async function enregistrer() {
    if (ecriture) { relancer = true; return; }
    ecriture = true;
    var v = version;
    try {
      var source = await (await fichier.getFile()).text();
      var sortie = remplacer(source);
      var flux = await fichier.createWritable();
      await flux.write(sortie);
      await flux.close();
      versionEcrite = v;
      if (version === versionEcrite) afficher('Enregistré dans ' + fichier.name);
    } catch (err) {
      autorise = false;
      afficher('Enregistrement impossible : le fichier a peut-être été déplacé ou renommé.',
        true, 'Choisir le fichier', lier);
    } finally {
      ecriture = false;
      if (relancer) { relancer = false; enregistrer(); }
    }
  }

  async function reprendre() {
    try {
      var r = await fichier.requestPermission({ mode: 'readwrite' });
      autorise = r === 'granted';
    } catch (err) {
      autorise = false;
    }
    if (autorise) {
      enregistrer();
    } else {
      afficher('Autorise l\'accès au fichier pour enregistrer tes changements.',
        true, 'Autoriser l\'enregistrement', reprendre);
    }
  }

  async function lier() {
    try {
      var liste = await window.showOpenFilePicker({
        multiple: false,
        types: [{ description: 'Page HTML', accept: { 'text/html': ['.html', '.htm'] } }]
      });
      var h = liste[0];
      var r = await h.requestPermission({ mode: 'readwrite' });
      if (r !== 'granted') {
        afficher('Autorise l\'accès au fichier pour enregistrer tes changements.',
          true, 'Enregistrer dans ce fichier', lier);
        return;
      }
      var source = await (await h.getFile()).text();
      if (!MOTIF.test(source) || source.indexOf('data-suivi="dofus-ocre"') < 0) {
        afficher('Ce fichier n\'est pas la page de suivi. Choisis ' + nomFichier() + '.',
          true, 'Enregistrer dans ce fichier', lier);
        return;
      }
      if (h.name !== nomFichier() &&
          !window.confirm('Remplacer la progression de « ' + h.name + ' » par celle de cette page ?')) {
        etatNonLie();
        return;
      }
      fichier = h;
      autorise = true;
      memoriser(h);
      await enregistrer();
    } catch (err) {
      if (err && err.name === 'AbortError') { etatNonLie(); return; }
      pickerDispo = false;
      afficher('Ouvre ce fichier directement dans Chrome ou Edge pour enregistrer chaque clic, ou télécharge-le.',
        true, 'Télécharger le fichier à jour', telecharger);
    }
  }

  function telecharger() {
    var copie = document.documentElement.cloneNode(true);
    copie.querySelector('#app').innerHTML = '';
    copie.querySelector('#donnees').textContent = '\n' + serialiser() + '\n';
    var html = '<!doctype html>\n' + copie.outerHTML;
    var lien = document.createElement('a');
    lien.href = URL.createObjectURL(new Blob([html], { type: 'text/html' }));
    lien.download = nomFichier();
    document.body.appendChild(lien);
    lien.click();
    lien.remove();
    setTimeout(function () { URL.revokeObjectURL(lien.href); }, 10000);
    versionEcrite = version;
    afficher('Téléchargé. Remplace l\'ancien fichier par celui-ci.', false,
      'Télécharger le fichier à jour', telecharger);
  }

  function ouvrirBase() {
    return new Promise(function (ok, ko) {
      var req = indexedDB.open('suivi-dofus-ocre', 1);
      req.onupgradeneeded = function () { req.result.createObjectStore('fichiers'); };
      req.onsuccess = function () { ok(req.result); };
      req.onerror = function () { ko(req.error); };
    });
  }

  async function memoriser(h) {
    try {
      var base = await ouvrirBase();
      base.transaction('fichiers', 'readwrite').objectStore('fichiers').put(h, location.pathname);
    } catch (err) { /* Le fichier sera simplement redemandé à la prochaine ouverture. */ }
  }

  async function retrouver() {
    try {
      var base = await ouvrirBase();
      var h = await new Promise(function (ok, ko) {
        var req = base.transaction('fichiers').objectStore('fichiers').get(location.pathname);
        req.onsuccess = function () { ok(req.result); };
        req.onerror = function () { ko(req.error); };
      });
      if (!h) return;
      fichier = h;
      autorise = (await h.queryPermission({ mode: 'readwrite' })) === 'granted';
      if (autorise) {
        afficher('Enregistré dans ' + h.name);
      } else {
        afficher('Clique sur une case, puis autorise l\'accès pour reprendre l\'enregistrement.',
          false, 'Autoriser l\'enregistrement', reprendre);
      }
    } catch (err) { /* Pas de fichier mémorisé. */ }
  }

  window.addEventListener('beforeunload', function (ev) {
    if (version !== versionEcrite) { ev.preventDefault(); ev.returnValue = ''; }
  });

  /* ---------- Sauvegarde en ligne (page hébergée sur claude.ai) ---------- */

  var enLigne = null;
  var connecte = false;
  var lectureSeule = false;
  var envoiMinuteur = null;
  var envoiEnCours = false;
  var envoiRelance = false;
  var reessaye = false;

  // Seuls les monstres avec au moins une case cochée sont stockés : { "nom": "010000" }.
  function etatEnLigne() {
    var m = {};
    donnees.etapes.forEach(function (e) {
      e.monstres.forEach(function (mo) {
        if (mo.cases.some(Boolean)) m[mo.nom] = mo.cases.join('');
      });
    });
    return m;
  }

  function appliquer(m) {
    m = m && typeof m === 'object' ? m : {};
    donnees.etapes.forEach(function (e, ei) {
      e.monstres.forEach(function (mo, l) {
        var s = typeof m[mo.nom] === 'string' ? m[mo.nom] : '';
        mo.cases.forEach(function (_, c) { poser(ei, l, c, s.charAt(c) === '1'); });
        majTout(ei, l);
      });
      majEtape(ei);
    });
    majHaut();
  }

  async function demarrerEnLigne() {
    var db = null;
    try { db = await window.claude.use('db'); } catch (err) { db = null; }
    if (!db) {
      afficher('Sauvegarde en ligne indisponible : connecte-toi à claude.ai pour retrouver ta progression.', true);
      return;
    }
    enLigne = db.doc('suivi/progression');
    var attente = setTimeout(function () {
      if (!connecte) afficher('La sauvegarde en ligne ne répond pas encore. Tes clics seront envoyés dès que possible.', true);
    }, 10000);
    enLigne.onSnapshot(function (snap) {
      if (!snap.metadata.fromCache) { connecte = true; clearTimeout(attente); }
      // Ne pas écraser des clics pas encore envoyés.
      if (snap.metadata.hasPendingWrites || envoiEnCours || version !== versionEcrite) return;
      appliquer(snap.exists ? (snap.data() || {}).m : {});
      if (connecte && !lectureSeule) afficher('Progression sauvegardée en ligne.');
    }, function () {
      clearTimeout(attente);
      afficher('La sauvegarde en ligne n\'est plus disponible : tes prochains clics ne seront pas enregistrés.', true);
    });
  }

  function planifierEnvoi() {
    if (lectureSeule) {
      afficher('Lecture seule : tes clics ne sont pas sauvegardés.', true);
      return;
    }
    afficher('Enregistrement…');
    clearTimeout(envoiMinuteur);
    envoiMinuteur = setTimeout(envoyer, 400);
  }

  async function envoyer() {
    if (envoiEnCours) { envoiRelance = true; return; }
    envoiEnCours = true;
    var v = version;
    try {
      await enLigne.set({ m: etatEnLigne() });
      versionEcrite = v;
      reessaye = false;
      if (version === versionEcrite) afficher('Progression sauvegardée en ligne.');
    } catch (err) {
      var code = err && err.code;
      if (code === 'unavailable' && !reessaye) {
        reessaye = true;
        setTimeout(envoyer, 800 + Math.random() * 1200);
      } else if (code === 'invalid_argument') {
        lectureSeule = true;
        afficher('Lecture seule : tu ne peux pas modifier cette progression.', true);
      } else if (code === 'quota_exceeded') {
        afficher('Espace de sauvegarde plein : tes derniers clics ne sont pas enregistrés.', true);
      } else {
        afficher('Enregistrement impossible pour le moment. Réessaie avec un nouveau clic.', true);
      }
    } finally {
      envoiEnCours = false;
      if (envoiRelance) { envoiRelance = false; envoyer(); }
    }
  }

  if (window.claude && typeof window.claude.use === 'function') {
    afficher('Connexion à la sauvegarde en ligne…');
    demarrerEnLigne();
  } else {
    etatNonLie();
    if (pickerDispo) retrouver();
  }
})();
</script>
</body>
</html>
